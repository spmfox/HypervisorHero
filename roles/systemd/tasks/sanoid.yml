- name: Create sanoid service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
  loop:
    - sanoid.service
    - sanoid.timer
  notify:
    - Reload systemd daemon
    - Enable sanoid.timer
  when:
    - sanoid_path_binary is defined
    - sanoid_path_config is defined
    - sanoid_jobs is defined
